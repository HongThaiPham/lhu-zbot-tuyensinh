services:
  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://bot-api:3001}
      NODE_ENV: production
    depends_on:
      bot-api:
        condition: service_started

  bot-api:
    build:
      context: .
      dockerfile: ./apps/bot-service/Dockerfile
    environment:
      BOT_SERVICE_ROLE: api
      DATABASE_URL: ${DATABASE_URL:?must set DATABASE_URL}
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:?must set REDIS_URL}
      ZALO_UPDATE_MODE: webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot-worker:
    build:
      context: .
      dockerfile: ./apps/bot-service/Dockerfile
    environment:
      BOT_SERVICE_ROLE: worker
      DATABASE_URL: ${DATABASE_URL:?must set DATABASE_URL}
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:?must set REDIS_URL}
      ZALO_UPDATE_MODE: webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lhu_zbot}
      POSTGRES_USER: ${POSTGRES_USER:?must set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lhu_zbot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
