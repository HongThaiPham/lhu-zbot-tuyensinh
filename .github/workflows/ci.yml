name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "$PR_TITLE" =~ ^Phase\ ([0-9]+):\ .+ ]]; then
            PHASE=$((10#${BASH_REMATCH[1]}))
            if [[ "$PHASE" -lt 0 || "$PHASE" -gt 25 ]]; then
              echo "Phase must be between 0 and 25; got: $PHASE"
              exit 1
            fi
            if [[ ! "$HEAD_REF" =~ ^(copilot/|phase/) ]]; then
              echo "Phase PRs must use a GitHub Copilot-managed copilot/* branch or a human-managed phase/* branch; got: $HEAD_REF"
              exit 1
            fi
            if [[ "$HEAD_REF" =~ ^phase/ ]] && [[ ! "$HEAD_REF" =~ ^phase/[0-9]{2}-[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Human-managed phase branches must match phase/NN-short-slug; got: $HEAD_REF"
              exit 1
            fi
            echo "Phase $PHASE PR accepted on branch: $HEAD_REF"
          else
            if [[ ! "$HEAD_REF" =~ ^(chore|docs|fix|ci|copilot)/ ]]; then
              echo "Non-phase PR branch must be a recognized maintenance or Copilot-managed branch; got: $HEAD_REF"
              exit 1
            fi
            echo "Non-phase governance/maintenance PR accepted: $HEAD_REF"
          fi

      - name: Ensure core governance files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f MASTER_IMPLEMENTATION_PLAN.md
          test -f .github/skills/phase-code-review/SKILL.md
          test -f .github/skills/phase-orchestrator/SKILL.md
          test -f docs/DEVELOPMENT_WORKFLOW.md

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4201
    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace bootstrap state
        id: workspace
        shell: bash
        run: |
          if [[ -f package.json && -f pnpm-lock.yaml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Workspace is not bootstrapped yet; full JS quality gate becomes mandatory once Phase 0 creates package.json and pnpm-lock.yaml."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.workspace.outputs.ready == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.workspace.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm test

      - name: Build
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm build

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect dependency manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name 'package.json' -o -name 'pnpm-lock.yaml' -o -name 'package-lock.json' -o -name 'yarn.lock' \) -not -path './.git/*' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest/lockfile exists before Phase 0; dependency review will become mandatory after workspace bootstrap."
          fi

      - name: Dependency review
        if: steps.manifests.outputs.present == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Dependency review bootstrap notice
        if: steps.manifests.outputs.present != 'true'
        shell: bash
        run: |
          echo "Dependency Review PASS (bootstrap state: no dependency manifests yet)."

  database-foundation:
    name: Database Foundation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lhu_zbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lhu_zbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: lhu_zbot
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:prisma:generate

      - name: Deploy migrations from zero
        run: DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public" pnpm db:migrate:deploy

      - name: Seed deterministic foundation data
        run: DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public" pnpm db:seed

      - name: Verify migration, pgvector, schema, and seed
        run: DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public" pnpm db:verify

  runtime-smoke:
    name: Runtime Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Runtime smoke test
        run: ./scripts/phase-0-compose-smoke.sh

  authentication-foundation:
    name: Authentication Foundation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authentication foundation verification
        run: ./scripts/phase-3-auth-foundation.sh

  zalo-api-foundation:
    name: Zalo API Foundation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zalo API foundation verification
        run: ./scripts/phase-4-zalo-api-foundation.sh

  zalo-polling-foundation:
    name: Zalo Polling Foundation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zalo polling foundation verification
        run: ./scripts/phase-5-zalo-polling-foundation.sh

  phase-review-contract:
    name: Phase Review Contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate phase review contract assets
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/skills/phase-code-review/SKILL.md
          test -f .github/skills/phase-orchestrator/SKILL.md
          test -f docs/DEVELOPMENT_WORKFLOW.md
