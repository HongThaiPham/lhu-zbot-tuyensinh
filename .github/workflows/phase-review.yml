name: Phase Review Contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  phase-contract:
    name: Phase Review Contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase PR
        id: phase
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" =~ ^phase/ ]]; then
            echo "is_phase=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_phase=false" >> "$GITHUB_OUTPUT"
            echo "Non-phase PR: phase-specific metadata validation is not applicable."
          fi

      - name: Validate phase metadata
        if: github.event_name == 'pull_request' && steps.phase.outputs.is_phase == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^phase/([0-9]{2})-[a-z0-9][a-z0-9-]*$ ]] || {
            echo "Invalid phase branch: $HEAD_REF"
            exit 1
          }
          BRANCH_PHASE=$((10#${BASH_REMATCH[1]}))
          [[ "$PR_TITLE" =~ ^Phase\ ([0-9]+):\ .+ ]] || {
            echo "Invalid PR title: $PR_TITLE"
            exit 1
          }
          TITLE_PHASE=$((10#${BASH_REMATCH[1]}))
          if [[ "$BRANCH_PHASE" -ne "$TITLE_PHASE" ]]; then
            echo "Branch phase ($BRANCH_PHASE) and title phase ($TITLE_PHASE) differ."
            exit 1
          fi
          if [[ "$TITLE_PHASE" -lt 0 || "$TITLE_PHASE" -gt 25 ]]; then
            echo "Phase must be between 0 and 25."
            exit 1
          fi
          grep -q "## Acceptance criteria" <<< "$PR_BODY" || {
            echo "PR body must contain an Acceptance criteria section."
            exit 1
          }
          grep -q "## Verification" <<< "$PR_BODY" || {
            echo "PR body must contain a Verification section."
            exit 1
          }
          grep -q "## Security considerations" <<< "$PR_BODY" || {
            echo "PR body must contain a Security considerations section."
            exit 1
          }

      - name: Verify review skill contract exists
        run: |
          set -euo pipefail
          test -f .github/skills/phase-code-review/SKILL.md
          grep -q "merge_allowed" .github/skills/phase-code-review/SKILL.md
          grep -q "BLOCKER" .github/skills/phase-code-review/SKILL.md
          grep -q "MAJOR" .github/skills/phase-code-review/SKILL.md

      - name: Explain merge contract
        run: |
          cat <<'EOF'
          For phase/* PRs this workflow validates phase metadata and the repository review contract.
          For governance/maintenance PRs the phase metadata check is intentionally not applicable, while the review-skill contract remains validated.
          GitHub required checks / branch rules remain authoritative and must never be bypassed.
          EOF
