name: Phase Review Contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  phase-contract:
    name: Phase Review Contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase PR from title
        id: phase
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "$PR_TITLE" =~ ^Phase\ ([0-9]+):\ .+ ]]; then
            PHASE=$((10#${BASH_REMATCH[1]}))
            echo "is_phase=true" >> "$GITHUB_OUTPUT"
            echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          else
            echo "is_phase=false" >> "$GITHUB_OUTPUT"
            echo "Non-phase PR: phase-specific metadata validation is not applicable."
          fi

      - name: Validate phase metadata
        if: github.event_name == 'pull_request' && steps.phase.outputs.is_phase == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PHASE: ${{ steps.phase.outputs.phase }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ "$PHASE" -lt 0 || "$PHASE" -gt 25 ]]; then
            echo "Phase must be between 0 and 25."
            exit 1
          fi
          if [[ ! "$HEAD_REF" =~ ^(copilot/|phase/) ]]; then
            echo "Phase PR must use a Copilot-managed copilot/* branch or human-managed phase/* branch; got: $HEAD_REF"
            exit 1
          fi
          grep -q "## Acceptance criteria" <<< "$PR_BODY" || {
            echo "PR body must contain an Acceptance criteria section."
            exit 1
          }
          grep -q "## Verification" <<< "$PR_BODY" || {
            echo "PR body must contain a Verification section."
            exit 1
          }
          grep -q "## Security considerations" <<< "$PR_BODY" || {
            echo "PR body must contain a Security considerations section."
            exit 1
          }
          echo "Phase $PHASE metadata accepted on branch $HEAD_REF"

      - name: Verify review skill contract exists
        run: |
          set -euo pipefail
          test -f .github/skills/phase-code-review/SKILL.md
          grep -q "merge_allowed" .github/skills/phase-code-review/SKILL.md
          grep -q "BLOCKER" .github/skills/phase-code-review/SKILL.md
          grep -q "MAJOR" .github/skills/phase-code-review/SKILL.md

      - name: Explain merge contract
        run: |
          cat <<'EOF'
          Phase identity is determined by the PR title, not by a custom branch name.
          GitHub Copilot Cloud Agent may use its GitHub-managed copilot/* branch.
          Phase PR metadata and review contracts remain mandatory.
          GitHub required checks / branch rules remain authoritative and must never be bypassed.
          EOF
