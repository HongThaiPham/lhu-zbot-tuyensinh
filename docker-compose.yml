services:
  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:4201}
    depends_on:
      bot-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:4201}
      NODE_ENV: development
    ports:
      - "${ADMIN_PORT:-4100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    user: "1000:1000"

  bot-api:
    build:
      context: .
      dockerfile: ./apps/bot-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_SERVICE_ROLE: api
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/lhu_zbot?schema=public}
      NODE_ENV: development
      PORT: 3001
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-development-only-app-encryption-key-not-for-production}
      ZALO_UPDATE_MODE: polling
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-development-zalo-token-placeholder}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lhu_admin_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:4100}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${BOT_API_PORT:-4201}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    user: "1000:1000"

  bot-worker:
    build:
      context: .
      dockerfile: ./apps/bot-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_SERVICE_ROLE: worker
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/lhu_zbot?schema=public}
      NODE_ENV: development
      PORT: 3001
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-development-only-app-encryption-key-not-for-production}
      ZALO_UPDATE_MODE: polling
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-development-zalo-token-placeholder}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lhu_admin_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:4100}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    restart: unless-stopped
    user: "1000:1000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lhu_zbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lhu_zbot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
